<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Norzin Consultancy</title>
    <style>
        .contact-form-pro {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--color-border);
            padding: var(--space-3xl);
            border-radius: 40px;
        }

        .input-pro {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-lg) 0;
            color: var(--color-text);
            font-family: inherit;
            font-size: 1.25rem;
            transition: var(--transition-med);
            margin-bottom: var(--space-2xl);
        }

        .input-pro:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .input-pro::placeholder {
            color: rgba(168, 162, 158, 0.3);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }
    </style>
  <script type="module" crossorigin src="/assets/main-x2fxgqHu.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-BMuBBsJX.css">
</head>

<body style="background: #000;">
    <nav class="navbar-pro">
        <a href="/" class="logo-pro">
            <div class="logo-icon-pro"></div>
            <span>Norzin</span>
        </a>
        <div class="nav-links-pro">
            <a href="/" class="nav-link-pro">Expertise</a>
            <a href="/about/" class="nav-link-pro">Heritage</a>
            <a href="/services/" class="nav-link-pro">Offerings</a>
            <a href="/insights/" class="nav-link-pro">Mindset</a>
            <a href="/contact/" class="nav-link-pro active">Connect</a>
        </div>
    </nav>

    <header class="section" style="padding-top: 10rem;">
        <div class="container"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4xl); align-items: start;">
            <div class="fade-up">
                <span
                    style="color: var(--color-accent); letter-spacing: 4px; font-size: 0.75rem; text-transform: uppercase;">Concierge</span>
                <h1 style="font-size: clamp(3rem, 6vw, 5rem); font-style: italic; margin-top: var(--space-sm);">Initiate
                    <br><span class="text-accent-gradient">Connection</span></h1>

                <div style="margin-top: var(--space-3xl); display: flex; flex-direction: column; gap: var(--space-xl);">
                    <div>
                        <h4
                            style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; color: var(--color-accent); margin-bottom: var(--space-xs);">
                            Location</h4>
                        <p style="font-size: 1.25rem;">Dharamsala, HP. India</p>
                    </div>
                    <div>
                        <h4
                            style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; color: var(--color-accent); margin-bottom: var(--space-xs);">
                            Digital</h4>
                        <p style="font-size: 1.25rem;">hi@norzinconsultancy.com</p>
                    </div>
                </div>
            </div>

            <form class="contact-form-pro fade-up">
                <input type="text" class="input-pro" placeholder="Full Name" required>
                <input type="email" class="input-pro" placeholder="Digital Address" required>
                <input type="text" class="input-pro" placeholder="Inquiry Type" required>
                <textarea class="input-pro" rows="4" placeholder="Brief Description of Objectives" required></textarea>
                <button type="submit" class="btn-pro btn-pro-primary" style="width: 100%;">Initialize Protocol</button>
            </form>
        </div>
    </header>

    <footer class="footer-pro">
        <div class="container" style="text-align: center; color: var(--color-text-muted); font-size: 0.75rem;">
            NORZIN CONSULTANCY &copy; 2026
        </div>
    </footer>

</body>

</html>
